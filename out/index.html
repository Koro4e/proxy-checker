let sortKey = "latency_ms", sortDir = 1;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const addr = r => r.host + ":" + r.port;
const getVal = (r,k) => k==="addr" ? addr(r) : (r[k] ?? "");

function render(){
  const fp = document.getElementById("fProto").value;
  const fc = document.getElementById("fCC").value;
  const fa = document.getElementById("fAnon").value;
  const fh = document.getElementById("fHttps").checked;
  const fr = document.getElementById("fResid").checked;
  const q  = document.getElementById("fSearch").value.trim().toLowerCase();

  let rows = DATA.proxies.filter(r =>
    (!fp || r.proto === fp) &&
    (!fc || r.cc === fc) &&
    (!fa || r.anon === fa) &&
    (!fh || r.https_ok === true) &&
    (!fr || r.hosting === false) &&
    (!q || (addr(r)+" "+(r.city||"")+" "+(r.isp||"")+" "+(r.country||"")).toLowerCase().includes(q))
  );
  rows.sort((a,b) => {
    const va = getVal(a,sortKey), vb = getVal(b,sortKey);
    if (typeof va === "number" || typeof vb === "number") return ((va??1e9) - (vb??1e9)) * sortDir;
    return String(va).localeCompare(String(vb)) * sortDir;
  });

  const tb = document.getElementById("tb");
  tb.innerHTML = rows.map(r => {
    const ms = r.latency_ms;
    const msCls = ms < 300 ? "ms-fast" : ms < 1000 ? "ms-mid" : "ms-slow";
    const typeCls = r.hosting ? "dc" : "resid";
    const typeTxt = r.hosting ? "DC" : "resid";
    return "<tr>" +
      "<td>" + esc(r.proto) + "</td>" +
      "<td>" + esc(addr(r)) + "</td>" +
      "<td class='" + msCls + "'>" + (ms ?? "?") + "</td>" +
      "<td>" + esc(r.cc || "??") + "</td>" +
      "<td>" + esc(r.city || "") + "</td>" +
      "<td>" + esc(r.isp || "") + "</td>" +
      "<td class='" + typeCls + "'>" + typeTxt + "</td>" +
      "<td>" + (r.https_ok ? "да" : "нет") + "</td>" +
      "<td class='" + esc(r.anon) + "'>" + esc(r.anon) + "</td>" +
      "<td class='src' title='" + esc(r.sources) + "'>" + esc(r.sources) + "</td>" +
    "</tr>";
  }).join("");
  document.getElementById("cnt").textContent = "показано " + rows.length + " из " + DATA.proxies.length;
}

function copyText(t, cb){
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); cb(ok);
    } catch (e) { cb(false); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(() => cb(true), () => fallback());
  else fallback();
}

let toastTimer = null;
function toast(msg){
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }

  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

// реальное время: по http опрашиваем снапшот каждые 5 с; по file:// перечитываем страницу сами (meta refresh)
if (location.protocol.indexOf("http") === 0) {
  setInterval(async () => {
    try {
      const r = await fetch("proxies_live.json?ts=" + Date.now(), {cache: "no-store"});
      if (r.ok) applyData(await r.json());
    } catch (e) {}
  }, 5000);
}

function applyData(d){
  DATA = d;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("v-alive", d.proxies.length);
  set("v-checked", d.checked ?? d.total_checked ?? 0);
  set("v-added", "+" + (d.added ?? 0));
  set("v-removed", "-" + (d.removed ?? 0));
  set("v-tracked", d.tracked ?? 0);
  const pn = document.getElementById("phase-note");
  if (pn) pn.textContent = d.phase === "live" ? "⚠ скан идёт — обновление каждые 5 с" : "скан завершён";
  render();
}

render();
</script>
</body>
</html>
